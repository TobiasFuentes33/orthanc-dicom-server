version: "3.3"

services:
  auth-gateway:
    environment:
      OHIF_TARGET: "http://ohif-local:3000"
    volumes:
      - ./doctor-auth-service:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  ohif-local:
    image: node:20-slim
    container_name: ohif-local
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - orthanc
    environment:
      NODE_ENV: development
      OHIF_OPEN: "false"
      OHIF_PORT: "3000"
    volumes:
      - ./ohif:/app
      - /app/node_modules
    command: sh -c "corepack enable && yarn install --frozen-lockfile && yarn dev:orthanc --host 0.0.0.0"
    ports:
      - "3001:3000"
